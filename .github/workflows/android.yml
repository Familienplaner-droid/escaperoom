# Baut bei jeder Änderung automatisch eine Test-App (APK) für Android.
# Die fertige Datei liegt danach unter "Actions" → letzter Lauf → "Artifacts".
name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          # App-Icon und Startbild aus assets/ erzeugen (sobald vorhanden)
          if [ -f assets/icon-only.png ]; then npx capacitor-assets generate --android; fi
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: escape-buecher-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Test-Version unter festem Link bereitstellen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk escape-buecher-test.apk
          gh release delete test -y --cleanup-tag || true
          gh release create test escape-buecher-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "Test-Version (neuester Stand)" \
            --notes "Automatisch gebaut aus dem neuesten Stand. Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben)."
